# DP-800: CI for the SQL Database Project
#   Every PR and every push to main -> build (model validation + code analysis) -> deploy to a
#   throwaway SQL Server 2025 container -> unit + integration tests.
#   Branch protection makes build-and-test a required check, so nothing reaches main without it.
#   (Deploying to a real Azure SQL database and drift detection are left out on purpose: this is a
#    learning project and the database is created by the scripts in sql/.)

name: sql-database-project

on:
  pull_request:
    branches: [main]            # no paths filter: build-and-test is a required check, so it must run on every PR
  push:
    branches: [main]
    paths: ["database-project/**"]
  workflow_dispatch:            # run it by hand from the Actions tab

permissions:
  contents: read

env:
  PROJECT_DIR: database-project
  DACPAC: database-project/bin/Release/TrailheadOps.dacpac

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}   # repo secret; only used by this throwaway container
        ports: ["1433:1433"]
    env:
      CI_CONN: "Server=localhost,1433;Database=TrailheadOps_CI;User ID=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build dacpac (validates syntax + references for the target platform, runs code analysis)
        run: dotnet build "$PROJECT_DIR/TrailheadOps.sqlproj" -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: dacpac
          path: ${{ env.DACPAC }}

      - name: Install SqlPackage and go-sqlcmd
        run: |
          dotnet tool install --global microsoft.sqlpackage
          curl -sSL -o sqlcmd.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/latest/download/sqlcmd-linux-amd64.tar.bz2
          tar -xjf sqlcmd.tar.bz2 sqlcmd && sudo mv sqlcmd /usr/local/bin/

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            sqlcmd -S localhost -U sa -P "${{ secrets.CI_SQL_SA_PASSWORD }}" -C -Q "SELECT 1" && exit 0
            sleep 5
          done
          echo "SQL Server did not start" && exit 1

      - name: Deploy dacpac to the CI container
        # The project targets Azure SQL DB; the container is SQL Server 2025 -> allow the platform mismatch here only.
        run: >
          sqlpackage /Action:Publish /SourceFile:"$DACPAC" /TargetConnectionString:"$CI_CONN"
          /p:AllowIncompatiblePlatform=True /p:BlockOnPossibleDataLoss=False

      - name: Run database tests
        run: |
          for f in "$PROJECT_DIR"/tests/00_*.sql "$PROJECT_DIR"/tests/10_*.sql "$PROJECT_DIR"/tests/20_*.sql; do
            sqlcmd -S localhost -U sa -P "${{ secrets.CI_SQL_SA_PASSWORD }}" -C -d TrailheadOps_CI -b -i "$f"
          done
          sqlcmd -S localhost -U sa -P "${{ secrets.CI_SQL_SA_PASSWORD }}" -C -d TrailheadOps_CI -b -i "$PROJECT_DIR/tests/run_all_tests.sql"

